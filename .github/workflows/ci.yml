name: CI

# What this proves: every platform backend COMPILES, and the platform-independent suite (C ABI layer
# against the in-memory fake backend, chunker) PASSES on Windows, Linux and macOS.
# What it does NOT prove: real advertising, real connections, over-the-air transfers, Unity builds.
# Those need manual hardware testing (see README.md "What CI does not cover").

on:
  push:
  pull_request:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  checks:
    name: Repo checks (hygiene, layers, Unity ABI parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check_hygiene.sh
      - run: sh scripts/check_layers.sh
      - run: python3 scripts/check_abi_parity.py

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (BlueZ / D-Bus / GLib dev packages)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libbluetooth-dev libdbus-1-dev libglib2.0-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android-client:
    # BleLink v1 Kotlin client (clients/android): codec + session JVM unit tests against
    # docs/protocol-test-vectors.json, the client over a fake transport, lint, and a sample APK build.
    # No Bluetooth hardware involved; the GATT transport is only compiled and linted.
    name: Android client (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (codec + session vs. test vectors)
        run: ./gradlew --no-daemon test
      - name: Lint + build sample APK
        run: ./gradlew --no-daemon lint :sample:assembleDebug
  ios-client:
    # BleLink v1 Swift client (clients/ios/BleLink): codec + session XCTests against
    # docs/protocol-test-vectors.json, plus compile checks for macOS and iOS. No Bluetooth hardware involved.
    name: iOS client (Swift)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/ios/BleLink
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Test (codec + session vs. test vectors)
        run: swift test
      - name: Build for iOS (compile check)
        run: xcodebuild -scheme BleLink -destination 'generic/platform=iOS' build

  windows:
    # MSVC AddressSanitizer is intentionally not enabled here (needs a separate runtime setup);
    # sanitizer coverage comes from the macOS and Linux jobs below.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  mcu-blelink:
    # BleLink v1 MCU client (clients/mcu/blelink): host unit tests against docs/protocol-test-vectors.json,
    # the same tests under ASan + UBSan, and a Cortex-M4 flash-size gate (< 8 KB).
    name: MCU client library (C99 host tests, sanitizers, flash size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Arm GCC toolchain (size check only)
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Host tests
        run: |
          cmake -S clients/mcu/blelink -B build-blelink -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-blelink
          ctest --test-dir build-blelink --output-on-failure
      - name: Host tests with ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S clients/mcu/blelink -B build-blelink-san -DCMAKE_BUILD_TYPE=Debug -DBLELINK_SANITIZERS=ON
          cmake --build build-blelink-san
          ctest --test-dir build-blelink-san --output-on-failure
      - name: Flash size on Cortex-M4 (-Os, bitwise CRC)
        working-directory: clients/mcu/blelink
        run: |
          for f in blelink blelink_codec; do
            arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -Os -std=c99 -ffunction-sections -Wall -Wextra -Wpedantic -Werror \
              -Iinclude -c src/$f.c -o /tmp/$f.o
          done
          arm-none-eabi-size -t /tmp/blelink.o /tmp/blelink_codec.o
          text=$(arm-none-eabi-size -t /tmp/blelink.o /tmp/blelink_codec.o | tail -1 | awk '{print $1 + $2}')
          echo "flash (text + data): $text bytes"
          test "$text" -lt 8192

  mcu-esp32:
    # Compile check of the ESP32 example (ESP-IDF NimBLE central). No hardware run.
    name: MCU example ESP32 (ESP-IDF build)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.2
    steps:
      - uses: actions/checkout@v4
      - name: idf.py build
        shell: bash
        working-directory: clients/mcu/blelink/ports/esp32-nimble
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build
          idf.py size

  mcu-zephyr:
    # Compile check of the Zephyr example for the nRF52840 DK (upstream Zephyr, see ports/zephyr/west.yml).
    name: MCU example Zephyr (nRF52840 DK build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: BluetoothServer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: BluetoothServer
          manifest-file-name: clients/mcu/blelink/ports/zephyr/west.yml
          toolchains: arm-zephyr-eabi
      - name: west build
        run: west build -b nrf52840dk/nrf52840 -d build-zephyr BluetoothServer/clients/mcu/blelink/ports/zephyr

  sanitizers:
    name: ASan + UBSan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libbluetooth-dev libdbus-1-dev libglib2.0-dev
      - name: Configure
        run: cmake -S . -B build-san -DENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-san
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure
