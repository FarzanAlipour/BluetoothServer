# Bluetooth central with GATT client
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_DEVICE_NAME="BleLink MCU demo"

# ATT_MTU 247 -> packetSize 244 (PROTOCOL.md 5, 14.4); ACL buffers large enough for one packet each
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Stacks: demo_evt_t (~250 B) lives on the BT RX stack while posting
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2560

CONFIG_PRINTK=y
CONFIG_LOG=y
